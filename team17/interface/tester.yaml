openapi: 3.1.1
info:
  title: Team 17 Tester (course cross-team testing interface)
  version: 1.1.0
  summary: Team 17's deployed tester, which runs our acceptance suite against a pod system.
  description: |
    The tester side of the course's "Cross-team Testing Interface". It runs Team 17's
    acceptance suite (the same tests published in `pod-k-shared/team17/tester/`) against a
    target system's base URL and returns one suite report with results and coverage.

    **Access.** Every request needs `Authorization: Bearer <token>`. Team 21 and the course
    staff each have their own token from Team 17 (never put it in a URL or the registry).
    `X-Actor` is not needed.

    **Targets.** Only approved pod systems: this service at the URL above, and Team 21's
    deployment (https://team21-cra-reporting-service.onrender.com, plus their earlier
    host). Any other `target_url` returns 400.

    **Timing.** Setup waits about 60 seconds at most for the target's `POST /test/setup`.
    A full run (222 tests) took 655 seconds (about 11 minutes) against our evaluation
    deployment and about 12 minutes against our development deployment on 2026-11-01; it
    stops at 28 minutes, and the request limit is 30 minutes. If your client gives up
    first, the run carries on: on 2026-11-01 our own client's connection dropped after
    9 minutes and the run still finished and stored its report. Fetch it with
    `GET /test/report` (409 until the run ends).

    **One run at a time.** Every test resets the target and fixes its clock, and all
    clients share one database, so the tester runs one suite at a time (a pod decision).
    While any session is running, `POST /test/run` for another session and
    `POST /test/setup` return 409 with `source: tester`; try again when the run ends.

    **Sessions.** Each setup creates a new session. A session runs once; repeating a suite
    needs a new session. Finished reports are kept in our database, so they survive
    restarts. A run cut off by a restart of our service (no sign of life for 3 minutes, or
    running past 33 minutes) is treated as aborted at the next request: its report keeps
    the outcomes recorded so far, marks the test that was running `error` with
    `source: tester` and the rest `skip`, and `GET /test/report` returns it. It no longer
    blocks other runs, and its session still can't run again.

    **After a run.** Once the suite and the coverage read finish, the tester releases the
    target's clock (`DELETE /test/clock`) and then resets it (`POST /test/reset`), also
    after an abort. This is best effort: a failure doesn't change the report. A run cut
    off by a restart is not cleaned up.

    **Errors** are problem details (RFC 9457) with the course's `message` and `source`.
    Besides the statuses listed per operation, a wrong method returns 405 and a POST body
    over 64 KB returns 413 (don't send a body on GET: Google's front end rejects it).
servers:
  - url: https://team17-prod-7zneiwx4ba-uc.a.run.app/tester
    description: Team 17 evaluation deployment (Orbit)
security:
  - bearerAuth: []
paths:
  /test/setup:
    post:
      operationId: testerSetup
      summary: Create a session and wait for the target's system setup to succeed
      description: |
        Generates a unique session ID, sends it to the target's `POST /test/setup` with
        `{"setup": {}}`, and returns it once the target answers 201 with the same ID. Does not
        run tests. A failed setup creates no runnable session.

        A target's error is passed on with the target's own status, so a 400, 401 or 413 here
        can come from the target too: `source` tells them apart (`tester` for our own
        checks, the target's source otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
            example:
              target_url: https://team21-cra-reporting-service.onrender.com
      responses:
        "201":
          description: The target is ready. The same session ID was returned by the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                session_id: run-3f2b8c1e-7d4a-4f0e-9a51-2c6d8e0b7f13
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            Another session's suite is running. Setup waits until it ends, because the
            target's setup could reset data the run is using. Our own 409; a target's 409
            comes back as described under `default`, with the target's `source`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InterfaceError"
              example:
                title: Conflict
                status: 409
                detail: Another test run is in progress; try again when it ends
                message: Another test run is in progress; try again when it ends
                source: tester
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        default:
          description: |
            The target's setup failed. A target error (4xx or 5xx) is returned with the
            target's own status, `message` and `source` (`system` if it gave none). Any
            other non-201 answer, or a 201 without the session ID, returns 500 with
            `source: system`. No response from the target returns 500 with
            `source: communication`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InterfaceError"
              example:
                title: Internal server error
                status: 500
                detail: "System setup failed: POST /test/setup failed: URLError"
                message: "System setup failed: POST /test/setup failed: URLError"
                source: communication
  /test/run:
    post:
      operationId: testerRun
      summary: Run the whole suite once and return the suite report
      description: |
        Runs every planned test in order against the session's target through the pod's
        project API, reads the target's `GET /test/report` for code coverage, releases the
        target's clock and resets it (best effort), stores the report, and returns it.
        One run at a time across all sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: |
            The suite finished. Failed tests and target errors are in `results`.

            The example is a run against our own evaluation deployment, with `results` cut
            to two entries (a real report lists every planned test). Because the target is
            a configured Team 17 system, `coverage.model` is present; its counts stay null
            until the design mapping is published and configured. Reports on other teams'
            systems have no `model`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
              example:
                session_id: run-3f2b8c1e-7d4a-4f0e-9a51-2c6d8e0b7f13
                target_url: https://team17-prod-7zneiwx4ba-uc.a.run.app
                results:
                  - test_id: test_phase3.py::TestRemotePhase3::test_ac01_intake_has_unique_ids_and_fixed_receipt_time
                    outcome: pass
                    message: Passed.
                  - test_id: test_phase3.py::TestRemotePhase3::test_ac15_health_is_public
                    outcome: pass
                    message: Passed.
                coverage:
                  code:
                    covered: null
                    total: null
                    basis: Source lines; the deployed service is not instrumented for code coverage
                  component:
                    covered: null
                    total: null
                    basis: The pod specification does not define a component list yet
                  system:
                    covered: 16
                    total: 19
                    basis: Pod acceptance criteria AC-01 to AC-19 with at least one executed test, identified by test name
                  model:
                    covered: null
                    total: null
                    basis: Design team17-phase5-design-v1; mapping not yet published/configured; see docs/model-coverage.md
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSession"
        "409":
          description: |
            This session has already run or is running now (also after an abort, and after
            a run cut off by a restart), or another session's suite is running now (one
            run at a time). Unknown sessions get 404 first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InterfaceError"
              example:
                title: Conflict
                status: 409
                detail: This session has already run
                message: This session has already run
                source: tester
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: |
            The tester aborted. If the suite hit its time limit or stopped early, the
            stored report keeps the recorded outcomes, marks the interrupted test `error`
            with `source: tester`, and the tests never started `skip`. If the tester itself
            failed, no outcomes are kept: the first planned test is `error` (source
            `tester`), the rest `skip`, and coverage is marked unavailable. If the run was
            taken for cut off while it was still going, the report stored then stands.
            Fetch the report with `GET /test/report`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InterfaceError"
              example:
                title: Internal server error
                status: 500
                detail: The test suite did not finish within 1680 seconds
                message: The test suite did not finish within 1680 seconds
                source: tester
  /test/report:
    get:
      operationId: testerReport
      summary: Retrieve the stored suite report without running tests
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: |
            The stored report, the same body a finished or aborted run produced. For a run
            cut off by a restart, the report built from the outcomes it had recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSession"
        "409":
          description: The suite hasn't run yet, or is still running. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InterfaceError"
              example:
                title: Conflict
                status: 409
                detail: The suite has not finished
                message: The suite has not finished
                source: tester
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Team 17 issues each client its own token privately.
  responses:
    InvalidRequest:
      description: |
        Invalid request: malformed JSON, a missing or unknown field, a target that isn't a
        plain HTTP(S) base URL (no query, fragment or credentials), or a target that isn't an
        approved pod system. An invalid request does not use up a session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InterfaceError"
          example:
            title: Invalid request
            status: 400
            detail: Invalid request
            errors:
              - field: target_url
                message: is not an approved pod system
            message: Invalid request
            source: tester
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InterfaceError"
          example:
            title: Unauthorized
            status: 401
            message: Unauthorized
            source: tester
    UnknownSession:
      description: No tester session has this ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InterfaceError"
          example:
            title: Not found
            status: 404
            detail: Unknown session
            message: Unknown session
            source: tester
    PayloadTooLarge:
      description: The request body is over 64 KB (65,536 bytes).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InterfaceError"
  schemas:
    SetupRequest:
      type: object
      additionalProperties: false
      required: [target_url]
      properties:
        target_url:
          type: string
          minLength: 1
          maxLength: 2000
          description: The target system's base URL, without `/test` or a trailing path.
    RunRequest:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id:
          type: string
          minLength: 1
          maxLength: 200
    Session:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          minLength: 1
    Report:
      type: object
      required: [session_id, target_url, results, coverage]
      properties:
        session_id:
          type: string
          minLength: 1
        target_url:
          type: string
          minLength: 1
        results:
          type: array
          description: |
            Every planned test exactly once, in the order run. Empty only if the tester
            failed so badly it couldn't list its tests.
          items:
            $ref: "#/components/schemas/Result"
        coverage:
          type: object
          description: |
            Code, pod-component and shared acceptance-criterion measures are always
            present. Starting in Phase 5, reports against an explicitly configured
            Team 17 system also include model: versioned design requirements
            evaluated in this session, not a pass rate. Other teams' reports omit
            model. Own-system identity uses exact canonical base URLs, including
            their paths, rather than token or hostname guesses. An unpublished
            design mapping or unavailable evaluation evidence yields null model
            counts with an explanatory basis. See ../model-coverage.md.
          required: [code, component, system]
          properties:
            code:
              $ref: "#/components/schemas/Measure"
            component:
              $ref: "#/components/schemas/Measure"
            system:
              $ref: "#/components/schemas/Measure"
            model:
              $ref: "#/components/schemas/Measure"
    Result:
      type: object
      required: [test_id, outcome, message]
      properties:
        test_id:
          type: string
          minLength: 1
          description: The test's pytest node ID, unique within the report.
        outcome:
          type: string
          enum: [pass, fail, error, skip]
        message:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/Source"
      if:
        properties:
          outcome:
            const: error
      then:
        required: [source]
    Measure:
      type: object
      description: "`covered` and `total` are both null when the measure isn't available; `basis` says why."
      required: [covered, total, basis]
      properties:
        covered:
          type: [integer, "null"]
          minimum: 0
        total:
          type: [integer, "null"]
          minimum: 0
        basis:
          type: string
          minLength: 1
    Source:
      type: string
      enum: [tester, system, communication, unknown]
    InterfaceError:
      type: object
      description: RFC 9457 problem details plus the course's `message` and `source`.
      required: [title, status, message, source]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        message:
          type: string
          minLength: 1
        source:
          $ref: "#/components/schemas/Source"
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
